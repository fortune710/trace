services:
  migrate:
    profiles: ["e2e"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    profiles: ["e2e"]
    environment:
      AUDIT_ENABLED: "true"
      AUTH_ENVIRONMENT: test
      AUTH_CREDENTIAL_ENCRYPTION_PROVIDER: local
      AUTH_CREDENTIAL_ENCRYPTION_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s
      AUTH_VAULT_TOKEN_FILE: ""
      AUTH_COOKIE_SECURE: "false"
      AUTH_ACCESS_COOKIE_NAME: trace_access
      AUTH_REFRESH_COOKIE_NAME: trace_refresh
      AUTH_CSRF_COOKIE_NAME: trace_csrf
      AUTH_COOKIE_SAME_SITE: lax
      AUTH_ALLOWED_ORIGINS: '["http://127.0.0.1:5173"]'
      AUTH_FRONTEND_URL: http://127.0.0.1:5173
      AUTH_JWT_ISSUER: http://127.0.0.1:18000
      AUTH_GITHUB_CLIENT_ID: github-e2e-client
      AUTH_GITHUB_CLIENT_SECRET: github-e2e-secret
      AUTH_GITHUB_REDIRECT_URI: http://127.0.0.1:18000/auth/oauth/github/callback
      AUTH_GITHUB_AUTHORIZE_URL: http://127.0.0.1:19000/github/authorize
      AUTH_GITHUB_TOKEN_URL: http://oauth-stub:9000/github/token
      AUTH_GITHUB_USER_URL: http://oauth-stub:9000/github/user
      AUTH_GITHUB_EMAILS_URL: http://oauth-stub:9000/github/user/emails
      AUTH_GOOGLE_CLIENT_ID: google-e2e-client
      AUTH_GOOGLE_CLIENT_SECRET: google-e2e-secret
      AUTH_GOOGLE_REDIRECT_URI: http://127.0.0.1:18000/auth/oauth/google/callback
      AUTH_GOOGLE_AUTHORIZE_URL: http://127.0.0.1:19000/google/authorize
      AUTH_GOOGLE_TOKEN_URL: http://oauth-stub:9000/google/token
      AUTH_GOOGLE_JWKS_URL: http://oauth-stub:9000/google/jwks
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      oauth-stub:
        condition: service_healthy

  email-worker:
    profiles: ["e2e"]
    environment:
      AUTH_ENVIRONMENT: test
      AUTH_CREDENTIAL_ENCRYPTION_PROVIDER: local
      AUTH_CREDENTIAL_ENCRYPTION_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s
      AUTH_VAULT_TOKEN_FILE: ""
      AUTH_FRONTEND_URL: http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  oauth-stub:
    profiles: ["e2e"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    command: ["uv", "run", "--offline", "--no-sync", "--locked", "uvicorn", "test_support.oauth_stub:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "127.0.0.1:19000:9000"
    networks:
      - edge
      - data
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:9000/google/jwks', timeout=3).status == 200"]
      interval: 5s
      timeout: 3s
      retries: 10
