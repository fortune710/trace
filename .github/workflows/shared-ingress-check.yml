name: Shared Ingress Configuration Check

on:
  pull_request:
    branches: [main]
    paths:
      - compose.production.yaml
      - config/haproxy/**
      - .github/workflows/shared-ingress-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose structure
        run: docker compose -f compose.production.yaml config --no-interpolate --quiet
      - name: Validate HAProxy syntax
        run: |
          docker run --rm --entrypoint haproxy \
            -v "$PWD/config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            haproxy:3.2-alpine -c -f /usr/local/etc/haproxy/haproxy.cfg
