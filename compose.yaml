name: trace

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT in .env}
      AUTH_ENVIRONMENT: ${AUTH_ENVIRONMENT:-development}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-trace_access}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-trace_refresh}
      AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-trace_csrf}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-http://localhost:8000}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-trace-api}
      AUTH_JWT_KID: ${AUTH_JWT_KID:-local-v1}
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:-}
      AUTH_JWT_VERIFICATION_KEYS: ${AUTH_JWT_VERIFICATION_KEYS:-{}}
      AUTH_TOKEN_HASH_KEY: ${AUTH_TOKEN_HASH_KEY:-}
      AUTH_CREDENTIAL_ENCRYPTION_PROVIDER: ${AUTH_CREDENTIAL_ENCRYPTION_PROVIDER:-vault}
      AUTH_CREDENTIAL_ENCRYPTION_KEY: ${AUTH_CREDENTIAL_ENCRYPTION_KEY:-}
      AUTH_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${AUTH_CREDENTIAL_ENCRYPTION_KEY_VERSION:-local-v1}
      AUTH_VAULT_ADDR: ${AUTH_VAULT_ADDR:-http://vault:8200}
      AUTH_VAULT_TOKEN_FILE: /run/vault/trace-backend-token
      AUTH_VAULT_TRANSIT_MOUNT: ${AUTH_VAULT_TRANSIT_MOUNT:-transit}
      AUTH_VAULT_TRANSIT_KEY: ${AUTH_VAULT_TRANSIT_KEY:-trace-provider-credentials}
      AUTH_VAULT_EMAIL_TRANSIT_KEY: ${AUTH_VAULT_EMAIL_TRANSIT_KEY:-trace-email-delivery}
      AUTH_VAULT_REQUEST_TIMEOUT_SECONDS: ${AUTH_VAULT_REQUEST_TIMEOUT_SECONDS:-3}
      AUTH_VAULT_TOKEN_RENEWAL_SECONDS: ${AUTH_VAULT_TOKEN_RENEWAL_SECONDS:-300}
      AUTH_CSRF_HMAC_KEY: ${AUTH_CSRF_HMAC_KEY:-}
      AUTH_AUDIT_HASH_KEY: ${AUTH_AUDIT_HASH_KEY:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-[]}
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-}
      AUTH_GITHUB_REDIRECT_URI: ${AUTH_GITHUB_REDIRECT_URI:-}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_REDIRECT_URI: ${AUTH_GOOGLE_REDIRECT_URI:-}
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-http://localhost:5173}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-Trace <no-reply@trace.local>}
      AUTH_EMAIL_MAX_RETRIES: ${AUTH_EMAIL_MAX_RETRIES:-3}
      AUTH_EMAIL_RETRY_DELAYS_SECONDS: ${AUTH_EMAIL_RETRY_DELAYS_SECONDS:-[30,300,1800]}
      AUTH_RABBITMQ_URL: ${AUTH_RABBITMQ_URL:?Set AUTH_RABBITMQ_URL in .env}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app:ro
      - vault_runtime:/run/vault:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      vault-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - edge
      - data
      - mail
      - secrets
      - queue
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/health', timeout=3); assert response.status == 200"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - ./migrate.sh
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in .env}
      TRACE_APP_PASSWORD: ${TRACE_APP_PASSWORD:?Set TRACE_APP_PASSWORD in .env}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app:ro
    networks:
      - data
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: "no"

  migrate-test:
    profiles:
      - test
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - ./migrate.sh
    environment:
      MIGRATION_DATABASE_URL: ${TEST_MIGRATION_DATABASE_URL:?Set TEST_MIGRATION_DATABASE_URL in .env}
      TRACE_APP_PASSWORD: ${TEST_TRACE_APP_PASSWORD:?Set TEST_TRACE_APP_PASSWORD in .env}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app:ro
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - data
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: "no"

  email-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./start-email-worker.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT in .env}
      AUTH_ENVIRONMENT: ${AUTH_ENVIRONMENT:-development}
      AUTH_CREDENTIAL_ENCRYPTION_PROVIDER: ${AUTH_CREDENTIAL_ENCRYPTION_PROVIDER:-vault}
      AUTH_CREDENTIAL_ENCRYPTION_KEY: ${AUTH_CREDENTIAL_ENCRYPTION_KEY:-}
      AUTH_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${AUTH_CREDENTIAL_ENCRYPTION_KEY_VERSION:-local-v1}
      AUTH_VAULT_ADDR: ${AUTH_VAULT_ADDR:-http://vault:8200}
      AUTH_VAULT_TOKEN_FILE: /run/vault/trace-backend-token
      AUTH_VAULT_TRANSIT_MOUNT: ${AUTH_VAULT_TRANSIT_MOUNT:-transit}
      AUTH_VAULT_EMAIL_TRANSIT_KEY: ${AUTH_VAULT_EMAIL_TRANSIT_KEY:-trace-email-delivery}
      AUTH_VAULT_REQUEST_TIMEOUT_SECONDS: ${AUTH_VAULT_REQUEST_TIMEOUT_SECONDS:-3}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-Trace <no-reply@trace.local>}
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-http://localhost:5173}
      AUTH_EMAIL_MAX_RETRIES: ${AUTH_EMAIL_MAX_RETRIES:-3}
      AUTH_EMAIL_RETRY_DELAYS_SECONDS: ${AUTH_EMAIL_RETRY_DELAYS_SECONDS:-[30,300,1800]}
      AUTH_RABBITMQ_URL: ${AUTH_RABBITMQ_URL:?Set AUTH_RABBITMQ_URL in .env}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app:ro
      - vault_runtime:/run/vault:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault-bootstrap:
        condition: service_completed_successfully
    networks:
      - data
      - mail
      - queue
      - secrets
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: trace
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - trace
        - -d
        - trace
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    profiles:
      - test
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: trace_test
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - trace
        - -d
        - trace_test
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    entrypoint:
      - redis-server
    command:
      - --save
      - ""
      - --appendonly
      - "no"
    networks:
      - data
    user: "999:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /data:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    environment:
      MP_MAX_MESSAGES: "500"
      MP_MAX_MESSAGE_SIZE: "10485760"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - edge
      - mail
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2.4-alpine@sha256:83522278ca69414e4895b3ea3c0f943c63ad316c063f9cda9c32fd42fe800f47
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - queue
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  vault:
    image: hashicorp/vault:1.21.3@sha256:5f244d447c6f90107149c9565da5ffedf847cec673ba0062a82fc3dd83c89e65
    command:
      - server
      - -dev
      - -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID:?Set VAULT_DEV_ROOT_TOKEN_ID in .env}
      - -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DISABLE_MLOCK: "true"
      SKIP_SETCAP: "true"
    networks:
      - secrets
    user: "100:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /home/vault:rw,noexec,nosuid,size=16m,uid=100,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD-SHELL
        - VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 10

  vault-bootstrap:
    image: hashicorp/vault:1.21.3@sha256:5f244d447c6f90107149c9565da5ffedf847cec673ba0062a82fc3dd83c89e65
    entrypoint:
      - /bin/sh
      - /bootstrap/vault-bootstrap.sh
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:?Set VAULT_DEV_ROOT_TOKEN_ID in .env}
      VAULT_TRANSIT_MOUNT: ${AUTH_VAULT_TRANSIT_MOUNT:-transit}
      VAULT_TRANSIT_KEY: ${AUTH_VAULT_TRANSIT_KEY:-trace-provider-credentials}
      VAULT_EMAIL_TRANSIT_KEY: ${AUTH_VAULT_EMAIL_TRANSIT_KEY:-trace-email-delivery}
      VAULT_BACKEND_TOKEN_FILE: /run/vault/trace-backend-token
    volumes:
      - ./scripts/vault-bootstrap.sh:/bootstrap/vault-bootstrap.sh:ro
      - vault_runtime:/run/vault
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - secrets
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    restart: "no"

volumes:
  postgres_data:
  postgres_test_data:
  vault_runtime:
  rabbitmq_data:

networks:
  edge:
  data:
    internal: true
  mail:
    internal: true
  secrets:
    internal: true
  queue:
    internal: true
