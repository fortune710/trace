global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    timeout connect 5s
    timeout client 65s
    timeout server 65s

frontend http_ingress
    bind :80
    mode http
    acl trace_host hdr(host) -i traceapi.fortunealebiosu.dev
    acl keepsafe_host hdr(host) -i keepsafeapi.fortunealebiosu.dev
    http-request deny unless trace_host or keepsafe_host
    use_backend trace_http if trace_host
    use_backend keepsafe_http if keepsafe_host

backend trace_http
    mode http
    server trace 127.0.0.1:18080

backend keepsafe_http
    mode http
    server keepsafe 127.0.0.1:28080

frontend tls_ingress
    bind :443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl trace_sni req.ssl_sni -i traceapi.fortunealebiosu.dev
    acl keepsafe_sni req.ssl_sni -i keepsafeapi.fortunealebiosu.dev
    use_backend keepsafe_tls if keepsafe_sni
    default_backend trace_tls

backend trace_tls
    mode tcp
    server trace 127.0.0.1:18443

backend keepsafe_tls
    mode tcp
    server keepsafe 127.0.0.1:28443
