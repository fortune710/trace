# Resolve the Docker service name at request time. This lets NGINX stay available
# and return 502 while the backend is starting or temporarily unavailable.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;
set $backend_upstream backend:8000;

# No URI after the upstream: /api/v1/reviews stays /api/v1/reviews.
proxy_pass http://$backend_upstream;
proxy_set_header Host traceapi.fortunealebiosu.dev;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host traceapi.fortunealebiosu.dev;
proxy_set_header X-Forwarded-Proto $scheme;
