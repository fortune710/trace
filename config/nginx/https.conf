log_format trace '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent';
access_log /var/log/nginx/access.log trace;

server {
    listen 8080;
    server_name trace.fortunealebiosu.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name trace.fortunealebiosu.dev;

    ssl_certificate /etc/letsencrypt/live/trace.fortunealebiosu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trace.fortunealebiosu.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /api {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location = /auth/callback {
        include /etc/nginx/trace/frontend-proxy.conf;
    }

    location ^~ /auth/ {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location = /health {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location = /openapi.json {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location ^~ /docs {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location / {
        include /etc/nginx/trace/frontend-proxy.conf;
    }
}
