server {
    listen 8080;
    server_name traceapi.fortunealebiosu.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://traceapi.fortunealebiosu.dev$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name traceapi.fortunealebiosu.dev;

    ssl_certificate /etc/letsencrypt/live/traceapi.fortunealebiosu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/traceapi.fortunealebiosu.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /api {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location = /api/v1/notifications/stream {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    # A local review uploads its source snapshot in this request. The API accepts up
    # to 5.4 MB of base64 content plus 3,000 entries with paths of up to 1,024
    # characters (4 bytes each in UTF-8), roughly 18 MB of JSON in the worst case.
    # Without this, NGINX's 1 MB default rejects valid uploads before FastAPI runs.
    location = /api/v1/reviews {
        client_max_body_size 20m;
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location ^~ /auth/ {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location = /health {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location = /openapi.json {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location ^~ /docs {
        include /etc/nginx/trace/backend-proxy.conf;
    }

    location / {
        return 404;
    }
}
