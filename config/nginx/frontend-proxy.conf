# Keep the existing frontend available when the domain points at this VPS.
proxy_pass https://traceai.vercel.app;
proxy_set_header Host traceai.vercel.app;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
